<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Broadsheet</title>
  <meta name="description" content="Broadsheet in your browser: read and post across Bluesky and Mastodon. Everything stays in this browser.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Broadsheet">
  <link rel="manifest" href="/web-files/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <style>
    @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 800; font-display: swap;
      src: url(/static/fonts/newsreader-latin.woff2) format("woff2"); }
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url(/static/fonts/inter-latin.woff2) format("woff2"); }
    :root { --bg: #ffffff; --text: #1a1a1a; --muted: #5f5f5f; --line: #e3e3e3; --accent: #1d4ed8; --danger: #b91c1c;
      color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --text: #ececec; --muted: #a3a3a3; --line: #2e2e2e; --accent: #93b4ff; --danger: #ff8a8a;
        color-scheme: dark; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    #app[hidden] { display: none; }
    .boot { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      box-sizing: border-box; }
    .boot[hidden] { display: none; }
    .card { max-width: 440px; width: 100%; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 2.4rem; margin: 0 0 6px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 18px 0 10px; }
    .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
    .error { color: var(--danger); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="card">
      <h1>Broadsheet</h1>
      <p class="muted">Bluesky and Mastodon in your browser. Your accounts and posts stay in this browser and never
        touch our server.</p>
      <div class="bar" aria-hidden="true"><span id="progress"></span></div>
      <p id="status" role="status">Starting…</p>
      <p class="muted small" id="hint">The first visit downloads about 20 MB. After that it opens from your browser's
        cache.</p>
      <p class="small"><a href="/">Back to the Broadsheet home page</a></p>
    </div>
  </div>
  <iframe id="app" title="Broadsheet" hidden></iframe>
  <script src="/web-files/shell.js"></script>
</body>
</html>
