name: pages-forward
# The downloads used to live on GitHub Pages, and desktop apps installed then still check it for updates. Run this
# once (after apps.yml has published to the website) to leave Pages as a forwarding site: its pages send people to
# the website, and its update manifest hands old apps a bundle that switches them to the website for good
# (see crossposter/config.py). Once those apps have had time to update, Pages can be turned off.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # must match apps.yml: it's part of the deps hash old apps compare
      - run: python -m crossposter_desktop.release bundle --out dist
      - name: Assemble the site
        run: |
          mkdir -p site/desktop
          cp pages-forward/* site/
          cp dist/manifest.json dist/crossposter-app.zip site/desktop/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
