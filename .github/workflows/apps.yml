name: apps
# Builds the desktop (Windows, macOS) and Android apps. On every push to main it also publishes them to
# Broadsheet's website (directory/ on Railway): the installers, and the app-code bundle installed desktop apps
# update themselves from. The upload proves where it came from with a GitHub OIDC token (directory/releases.py).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_android_release:
        description: Publish a signed APK for new installs only; existing debug-signed installs cannot update
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # bundle and desktop shells must agree, it's part of the deps hash

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m crossposter_desktop.release bundle --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-desktop.txt
      - run: python -m crossposter_desktop.release info --out build/app-info/build.json
      - run: pyinstaller crossposter_desktop/crossposter.spec --noconfirm

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CROSSPOSTER_DESKTOP_DATA: ${{ runner.temp }}\cp-smoke
        run: |
          # Mark every file as downloaded from the internet, as unzipping a download in Explorer does. The exe
          # itself is left unmarked: running a marked exe opens Windows' "are you sure" prompt, which a user clicks
          # through but would hang CI.
          $exe = (Resolve-Path "dist\Broadsheet\Broadsheet.exe").Path
          $runtime = Get-ChildItem "dist\Broadsheet" -Recurse -Filter Python.Runtime.dll | Select-Object -First 1
          Get-ChildItem "dist\Broadsheet" -Recurse -File | Where-Object FullName -ne $exe | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          if (-not (Get-Item -LiteralPath $runtime.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
            Write-Error "couldn't mark $($runtime.FullName)"; exit 1
          }
          Write-Output "Marked the build's files as downloaded"
          # A crash in the windowed app opens an error dialog and waits, so give up after three minutes.
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru
          $null = $p.Handle  # keeps ExitCode readable after the wait
          $done = $p.WaitForExit(180000)
          Get-Content "$env:CROSSPOSTER_DESKTOP_DATA\desktop.log" -ErrorAction SilentlyContinue
          if (-not $done) { $p.Kill(); Write-Error "Broadsheet.exe didn't finish the smoke test (crashed?)"; exit 1 }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Get-Item -LiteralPath $runtime.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
            Write-Error "the app didn't clear the download flag from $($runtime.Name)"; exit 1
          }
          Compress-Archive -Path "dist\Broadsheet" -DestinationPath "Broadsheet-windows.zip"
      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        env:
          CROSSPOSTER_DESKTOP_DATA: ${{ runner.temp }}/cp-smoke
        run: |
          "dist/Broadsheet.app/Contents/MacOS/Broadsheet" --smoke
          ditto -c -k --keepParent "dist/Broadsheet.app" Broadsheet-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: Broadsheet-${{ matrix.platform }}.zip

  android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # Chaquopy needs the same Python version on the build machine
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleDebug --console=plain
      - name: Stage debug APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Broadsheet-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: Broadsheet-android.apk

  android-emulator:
    # Installs the APK on an emulator and checks the app's server starts. Kept out of the publish path:
    # hosted-runner emulators sometimes fail to boot, and that shouldn't hold back a release.
    needs: android
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The emulator sometimes fails to come up on hosted runners; give it longer and cold-boot.
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: android/ci-smoke.sh Broadsheet-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshot
          path: android-screenshot.png
          if-no-files-found: ignore

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [bundle, desktop]
    runs-on: ubuntu-latest
    env:
      SITE: https://broadsheet-feeds-production.up.railway.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Wait for the website to be up
        # If this push also changed the site, Railway may still be deploying it.
        run: |
          for i in $(seq 60); do
            curl -fsS "$SITE/api/releases" >/dev/null && exit 0
            sleep 15
          done
          echo "The website isn't answering at $SITE"; exit 1
      - name: Carry forward the existing legacy Android APK unchanged
        run: curl -fL --retry 4 --retry-all-errors "$SITE/downloads/Broadsheet-android.apk" -o out/Broadsheet-android.apk
      - name: Upload to the website
        run: |
          token() {
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=broadsheet-releases" | jq -r .value
          }
          # Carry forward the exact existing signer until migration is verified; never replace it with a new signer here.
          for f in Broadsheet-windows.zip Broadsheet-macos.zip Broadsheet-android.apk crossposter-app.zip manifest.json; do
            echo "Uploading $f ($(du -h "out/$f" | cut -f1))"
            curl -fsS --retry 4 --retry-all-errors -X PUT -H "Authorization: Bearer $(token)" \
              -H "Content-Type: application/octet-stream" --data-binary "@out/$f" "$SITE/api/releases/$GITHUB_SHA/$f"
            echo
          done
          curl -fsS --retry 4 --retry-all-errors -X POST -H "Authorization: Bearer $(token)" "$SITE/api/releases/$GITHUB_SHA/publish"
      - name: Attach to the desktop-latest GitHub release
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --title "Broadsheet apps" --notes "Downloads: $SITE/" --target "$GITHUB_SHA"
          gh release upload desktop-latest out/Broadsheet-windows.zip out/Broadsheet-macos.zip out/Broadsheet-android.apk out/crossposter-app.zip --clobber
          gh release upload desktop-latest out/manifest.json --clobber

  android-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_android_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify signing credentials and migration gate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            test -n "$value" || { echo "$name is required"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          test -s "$RUNNER_TEMP/android-signing/release.keystore"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: 0.2.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          # Reserve three decimal digits per run for reruns; starts well above legacy code (< 1,000,000).
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          ./gradlew assembleRelease --console=plain
      - name: Validate APK and stage Obtainium asset
        env:
          VERSION_NAME: 0.2.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          export PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1):$PATH"
          apksigner verify --verbose "$apk"
          badging=$(aapt dump badging "$apk")
          package_line=$(printf '%s\n' "$badging" | grep -E "^package:.*name='com\.andreasthinks\.crossposter'")
          printf '%s\n' "$package_line" | grep -Eq "(^| )versionCode='$VERSION_CODE'( |$)"
          printf '%s\n' "$package_line" | grep -Eq "(^| )versionName='$VERSION_NAME'( |$)"
          mkdir -p release
          cp "$apk" release/Broadsheet-${VERSION_NAME}.apk
      - name: Publish immutable versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 0.2.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          tag="android-v${VERSION_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Refusing to overwrite existing release $tag"; exit 1; fi
          gh release create "$tag" release/Broadsheet-${VERSION_NAME}.apk \
            --title "Broadsheet Android ${VERSION_NAME}" \
            --notes "New installs only. No supported migration from existing Android installs; do not uninstall the legacy app. The legacy website download remains available." \
            --target "$GITHUB_SHA"
