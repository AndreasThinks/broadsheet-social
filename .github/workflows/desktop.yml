name: desktop
# Builds the desktop app. On every push to main it also publishes to the rolling "desktop-latest"
# release: the app-code bundle that installed apps update themselves from, and fresh installers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # bundle and shells must agree, it's part of the deps hash

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m crossposter_desktop.release bundle --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-desktop.txt
      - run: python -m crossposter_desktop.release info --out build/app-info/build.json
      - run: pyinstaller crossposter_desktop/crossposter.spec --noconfirm

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CROSSPOSTER_DESKTOP_DATA: ${{ runner.temp }}\cp-smoke
        run: |
          $p = Start-Process -FilePath "dist\Cross-poster\Cross-poster.exe" -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$env:CROSSPOSTER_DESKTOP_DATA\desktop.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Compress-Archive -Path "dist\Cross-poster" -DestinationPath "Cross-poster-windows.zip"
      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        env:
          CROSSPOSTER_DESKTOP_DATA: ${{ runner.temp }}/cp-smoke
        run: |
          "dist/Cross-poster.app/Contents/MacOS/Cross-poster" --smoke
          ditto -c -k --keepParent "dist/Cross-poster.app" Cross-poster-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: Cross-poster-${{ matrix.platform }}.zip

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [bundle, app]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to the desktop-latest release
        run: |
          set -e
          notes="Latest desktop build of ${GITHUB_SHA::7}. Download the zip for your computer, unzip it and open Cross-poster. Installed apps pick up new versions of the code by themselves."
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --title "Cross-poster desktop" --notes "$notes" --target "$GITHUB_SHA"
          # Installers and the code bundle first, manifest last, so apps never see a manifest
          # that points at files which aren't there yet.
          gh release upload desktop-latest out/Cross-poster-windows.zip out/Cross-poster-macos.zip out/crossposter-app.zip --clobber
          gh release upload desktop-latest out/manifest.json --clobber
          gh release edit desktop-latest --notes "$notes"
